name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug
        run: gradle assembleDebug --no-daemon --parallel --max-workers=16

      - name: Build Release
        run: gradle assembleRelease --no-daemon --parallel --max-workers=16

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v9.0.${{ github.run_number }}
          name: 灵动岛 v9.0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
