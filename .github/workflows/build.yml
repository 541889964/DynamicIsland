name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --parallel --max-workers=16

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --parallel --max-workers=16

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v7.0.${{ github.run_number }}
          name: 灵动岛 v7.0.${{ github.run_number }}
          body: |
            ## 灵动岛 v7.0
            - 三风格设计系统（iPhone / 液态玻璃 / 卡片）
            - 灵动岛拖动交互（左吸附 / 右吸附 / 上隐藏）
            - 网易云搜索 + 本地全盘扫描
            - 免密钥天气
            - 500 字软件介绍弹窗
            - UI 极致打磨
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
